<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrix Logo Showcase</title>
    <style>
        body {
            background: #05060f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        .logo-container {
            background: #0a0b1e;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { margin: 0; font-size: 1.2rem; color: #667eea; }
        .label { font-size: 0.9rem; opacity: 0.7; text-align: center; }
        svg { filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.3)); }
    </style>
</head>
<body>
    <h1>Zentrix Modern Logo Concepts</h1>
    
    <div class="logo-container">
        <h2>Option 1: The Pulse</h2>
        <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 30H75L25 70H75" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="75" cy="70" r="5" fill="#00f2fe"/>
            <defs>
                <linearGradient id="g1" x1="25" y1="30" x2="75" y2="70" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#667eea"/>
                    <stop offset="1" stop-color="#764ba2"/>
                </linearGradient>
            </defs>
        </svg>
        <div class="label">Minimalist Linear style. Very modern and fast.</div>
    </div>

    <div class="logo-container">
        <h2>Option 2: The Hex-Node</h2>
        <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 15L85 35V65L50 85L15 65V35L50 15Z" stroke="#4facfe" stroke-width="4" stroke-opacity="0.3"/>
            <path d="M30 35H70L30 65H70" stroke="url(#g2)" stroke-width="10" stroke-linecap="square"/>
            <defs>
                <linearGradient id="g2" x1="30" y1="35" x2="70" y2="65" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00f2fe"/>
                    <stop offset="1" stop-color="#4facfe"/>
                </linearGradient>
            </defs>
        </svg>
        <div class="label">Geometric SaaS architecture vibe.</div>
    </div>

    <div class="logo-container">
        <h2>Option 3: The Interlock</h2>
        <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 25H80L50 50L20 25Z" fill="url(#g3)" fill-opacity="0.8"/>
            <path d="M80 75H20L50 50L80 75Z" fill="url(#g4)" fill-opacity="0.8"/>
            <defs>
                <linearGradient id="g3" x1="20" y1="25" x2="80" y2="50" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#667eea"/>
                    <stop offset="1" stop-color="#764ba2"/>
                </linearGradient>
                <linearGradient id="g4" x1="80" y1="75" x2="20" y2="50" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00f2fe"/>
                    <stop offset="1" stop-color="#4facfe"/>
                </linearGradient>
            </defs>
        </svg>
        <div class="label">Premium interlocking shapes.</div>
    </div>
</body>
</html>
