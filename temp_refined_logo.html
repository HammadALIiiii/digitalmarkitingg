<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrix Refined Logo Preview</title>
    <style>
        body {
            background: #05060f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        .preview-box {
            text-align: center;
            background: #0a0b1e;
            padding: 60px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 30px; font-weight: 300; }
    </style>
</head>
<body>
    <div class="preview-box">
        <h1>Refined "Zenith Hex" Logo</h1>
        <svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5L89 27.5V72.5L50 95L11 72.5V27.5L50 5Z" stroke="url(#glow_grad)" stroke-width="2" stroke-opacity="0.4" style="filter: blur(4px);"/>
            <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#accent_grad)" stroke-width="3" stroke-opacity="0.6"/>
            <path d="M30 35H70L35 65H70" stroke="url(#primary_grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.5));"/>
            <defs>
                <linearGradient id="primary_grad" x1="30" y1="35" x2="70" y2="65" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#667eea"/>
                    <stop offset="1" stop-color="#764ba2"/>
                </linearGradient>
                <linearGradient id="accent_grad" x1="15" y1="30" x2="85" y2="70" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#00f2fe"/>
                    <stop offset="1" stop-color="#4facfe"/>
                </linearGradient>
                <linearGradient id="glow_grad" x1="11" y1="5" x2="89" y2="95" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#667eea"/>
                    <stop offset="1" stop-color="#00f2fe"/>
                </linearGradient>
            </defs>
        </svg>
    </div>
</body>
</html>
